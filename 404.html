<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    
    <script>
      // GitHub Pages 404 fallback for React Router SPA
      // Builds a hash-based redirect so the React app can handle the route.
      (function() {
        fetch('/index.html')
          .then(function(resp){ return resp.text(); })
          .then(function(html){
            document.open();
            document.write(html);
            document.close();
          });
      })();
    </script>
  </head>
  <body>
    <h1>Redirecting…</h1>
  </body>
</html>
